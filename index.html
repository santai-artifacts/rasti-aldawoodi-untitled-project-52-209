<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --panel-2:#1c2230;
    --grid:#141a24;
    --grid-alt:#111721;
    --accent:#3fb950;
    --accent-2:#2ea043;
    --food:#f85149;
    --food-glow:#ff6b64;
    --text:#e6edf3;
    --muted:#8b949e;
    --border:#2d3644;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Space Grotesk',system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#16202e 0%,var(--bg) 55%);
    color:var(--text);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .app{width:100%;max-width:520px;display:flex;flex-direction:column;gap:18px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
  .title{display:flex;align-items:center;gap:12px}
  .logo{
    width:40px;height:40px;border-radius:11px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;
    box-shadow:0 6px 20px -6px var(--accent);
  }
  .logo svg{width:22px;height:22px}
  h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
  .subtitle{font-size:13px;color:var(--muted);margin-top:2px}

  .scores{display:flex;gap:10px}
  .stat{
    background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:8px 14px;min-width:78px;text-align:center;
  }
  .stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .stat .value{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}

  .board-wrap{position:relative;border-radius:18px;overflow:hidden;
    border:1px solid var(--border);
    background:var(--panel);
    box-shadow:0 24px 60px -30px rgba(0,0,0,.8);
  }
  canvas{display:block;width:100%;height:auto;touch-action:none}

  .overlay{
    position:absolute;inset:0;display:grid;place-items:center;
    background:rgba(9,13,20,.78);backdrop-filter:blur(6px);
    text-align:center;padding:24px;transition:opacity .25s ease;
  }
  .overlay.hidden{opacity:0;pointer-events:none}
  .overlay h2{font-size:28px;font-weight:700;margin-bottom:8px;letter-spacing:-.02em}
  .overlay p{color:var(--muted);font-size:14px;margin-bottom:20px;max-width:280px}
  .btn{
    font-family:inherit;font-size:15px;font-weight:600;color:#06210d;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border:none;border-radius:12px;padding:12px 26px;cursor:pointer;
    box-shadow:0 8px 24px -8px var(--accent);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px -8px var(--accent)}
  .btn:active{transform:translateY(0)}
  .keys{margin-top:18px;display:flex;gap:6px;justify-content:center;color:var(--muted);font-size:12px;align-items:center;flex-wrap:wrap}
  kbd{
    font-family:inherit;background:var(--panel-2);border:1px solid var(--border);
    border-bottom-width:2px;border-radius:6px;padding:3px 8px;font-size:12px;color:var(--text);
  }
  .hint{text-align:center;font-size:12.5px;color:var(--muted)}
  .hint kbd{margin:0 2px}

  @media (max-width:520px){
    h1{font-size:22px}
    .stat{min-width:64px;padding:7px 11px}
    .stat .value{font-size:19px}
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#06210d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 7h9a4 4 0 0 1 0 8H8a3 3 0 0 0 0 6"/>
            <circle cx="5" cy="7" r="0.5" fill="#06210d"/>
          </svg>
        </div>
        <div>
          <h1>Snake</h1>
          <div class="subtitle">Eat, grow, don't bite yourself.</div>
        </div>
      </div>
      <div class="scores">
        <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
        <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="480" height="480"></canvas>
      <div class="overlay" id="overlay">
        <div>
          <h2 id="ov-title">Ready to play?</h2>
          <p id="ov-text">Guide the snake to the food. Each bite makes you longer and faster.</p>
          <button class="btn" id="start-btn">Start Game</button>
          <div class="keys">
            <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>
            <span>or</span>
            <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
            <span>to move</span>
          </div>
        </div>
      </div>
    </div>

    <div class="hint">
      Press <kbd>Space</kbd> to pause · <kbd>Enter</kbd> to restart · swipe on mobile
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovText = document.getElementById('ov-text');
  const startBtn = document.getElementById('start-btn');

  const GRID = 20;                 // cells per side
  const CELL = canvas.width / GRID; // pixel size of a cell

  // Game state
  let snake, dir, nextDir, food, score, best, speed, running, paused, alive;
  let acc = 0, last = 0, popT = 0, foodPop = 0;

  best = Number(memGet('snake_best') || 0);
  bestEl.textContent = best;

  function reset(){
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    speed = 7;            // cells per second (grows with score)
    alive = true;
    paused = false;
    placeFood();
    scoreEl.textContent = score;
    acc = 0;
  }

  function placeFood(){
    let p;
    do { p = {x:(Math.random()*GRID)|0, y:(Math.random()*GRID)|0}; }
    while (snake.some(s => s.x===p.x && s.y===p.y));
    food = p;
    foodPop = 1;
  }

  function startGame(){
    reset();
    running = true;
    overlay.classList.add('hidden');
    last = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver(){
    alive = false;
    running = false;
    if (score > best){ best = score; memSet('snake_best', best); bestEl.textContent = best; }
    ovTitle.textContent = 'Game Over';
    ovText.innerHTML = `You scored <b style="color:var(--text)">${score}</b>${score===best&&score>0?' — a new best!':''}. Ready for another run?`;
    startBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function setDir(nx, ny){
    // prevent reversing directly into self
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = {x:nx, y:ny};
  }

  function step(){
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // wall collision
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID){ gameOver(); return; }
    // self collision
    if (snake.some(s => s.x===head.x && s.y===head.y)){ gameOver(); return; }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y){
      score++;
      scoreEl.textContent = score;
      popT = 1;
      speed = Math.min(16, 7 + score * 0.35); // ramp difficulty, capped
      placeFood();
    } else {
      snake.pop();
    }
  }

  function loop(t){
    const dt = (t - last) / 1000;
    last = t;
    if (running && !paused && alive){
      acc += dt;
      const interval = 1 / speed;
      while (acc >= interval){ acc -= interval; step(); if(!alive) break; }
    }
    popT = Math.max(0, popT - dt*4);
    foodPop = Math.max(0, foodPop - dt*3);
    draw();
    if (running) requestAnimationFrame(loop);
  }

  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function draw(){
    // checkerboard background
    for (let y=0;y<GRID;y++){
      for (let x=0;x<GRID;x++){
        ctx.fillStyle = (x+y)%2 ? '#111721' : '#141a24';
        ctx.fillRect(x*CELL, y*CELL, CELL, CELL);
      }
    }

    // food
    const fp = 1 + foodPop*0.25;
    const fcx = food.x*CELL + CELL/2, fcy = food.y*CELL + CELL/2;
    const fr = (CELL*0.32) * fp;
    ctx.save();
    ctx.shadowColor = '#ff6b64';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#f85149';
    ctx.beginPath();
    ctx.arc(fcx, fcy, fr, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // snake
    const n = snake.length;
    for (let i=n-1;i>=0;i--){
      const s = snake[i];
      const tPct = i/Math.max(1,n-1);
      // gradient from bright head to deeper tail
      const g = Math.round(0x3f + (0x2e-0x3f)*tPct);
      const col = `rgb(${Math.round(80 - 40*tPct)}, ${Math.round(200 - 70*tPct)}, ${Math.round(90 - 30*tPct)})`;
      const pad = 1.5 + tPct*1.2;
      let size = CELL - pad*2;
      let ox = 0, oy = 0;
      if (i===0 && popT>0){ // subtle head pop on eat
        const grow = popT*2;
        size += grow; ox -= grow/2; oy -= grow/2;
      }
      ctx.fillStyle = col;
      rr(s.x*CELL+pad+ox, s.y*CELL+pad+oy, size, size, Math.min(size/2, 6));
      ctx.fill();
    }

    // eyes on the head
    if (n){
      const h = snake[0];
      const cx = h.x*CELL, cy = h.y*CELL;
      ctx.fillStyle = '#06210d';
      const ex = dir.x, ey = dir.y;
      const e1x = cx + CELL*0.5 + ex*CELL*0.12 - ey*CELL*0.18;
      const e1y = cy + CELL*0.5 + ey*CELL*0.12 - ex*CELL*0.18;
      const e2x = cx + CELL*0.5 + ex*CELL*0.12 + ey*CELL*0.18;
      const e2y = cy + CELL*0.5 + ey*CELL*0.12 + ex*CELL*0.18;
      ctx.beginPath(); ctx.arc(e1x,e1y,CELL*0.08,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2x,e2y,CELL*0.08,0,Math.PI*2); ctx.fill();
    }

    // pause veil
    if (paused && running){
      ctx.fillStyle = 'rgba(9,13,20,.6)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#e6edf3';
      ctx.font = '600 26px "Space Grotesk", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Paused', canvas.width/2, canvas.height/2);
    }
  }

  // ---- input ----
  const KEYMAP = {
    ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
    w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
    W:[0,-1], S:[0,1], A:[-1,0], D:[1,0]
  };
  window.addEventListener('keydown', e => {
    if (KEYMAP[e.key]){ e.preventDefault(); if(running && !paused) setDir(...KEYMAP[e.key]); }
    else if (e.key === ' '){ e.preventDefault(); if (running && alive) paused = !paused; }
    else if (e.key === 'Enter'){ startGame(); }
  });
  startBtn.addEventListener('click', startGame);

  // touch / swipe
  let tsx=0, tsy=0;
  canvas.addEventListener('touchstart', e=>{ const t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; }, {passive:true});
  canvas.addEventListener('touchend', e=>{
    const t=e.changedTouches[0];
    const dx=t.clientX-tsx, dy=t.clientY-tsy;
    if (Math.abs(dx)<20 && Math.abs(dy)<20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx>0?1:-1, 0);
    else setDir(0, dy>0?1:-1);
  }, {passive:true});

  // in-memory store (no persistence available in sandbox)
  const _mem = {};
  function memGet(k){ return _mem[k]; }
  function memSet(k,v){ _mem[k]=v; }

  // initial idle render
  reset(); running=false; draw();
})();
</script>
</body>
</html>
